name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      # A real mongod, so the isolation and idempotency suites actually run.
      # STEADING_REQUIRE_DB below turns "no database" into a failure rather
      # than a skip — the Phase 1 exit gate cannot be met by a suite that
      # quietly did not execute.
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGODB_TEST_URI: mongodb://localhost:27017
      STEADING_REQUIRE_DB: '1'
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DB: steading
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else

    steps:
      - uses: actions/checkout@v4

      # No version pin here on purpose — action-setup reads packageManager from
      # package.json, so CI and a developer machine cannot drift apart.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Blocking, per Phase 1 spec T5.
      - name: Lint
        run: pnpm lint

      - name: No inline disables of the db guard
        run: pnpm check:no-db-disables

      - name: Typecheck
        run: pnpm typecheck

      # Includes the isolation suite (the exit gate) and the idempotency suite.
      - name: Test
        run: pnpm test

      # The three scripts CI never invoked — which is exactly why two of them
      # were broken from the day they were written. Running them here means a
      # setup command cannot rot unnoticed again.
      - name: Apply indexes (pnpm db:indexes)
        run: pnpm db:indexes

      - name: Seed the first org and owner (pnpm db:seed)
        run: pnpm db:seed "CI Farm" ci-owner@example.test 'a properly long passphrase'

      - name: Verify the server data path (pnpm db:verify)
        run: pnpm db:verify

      # ── The client, which is now the only one ────────────────────────────
      #
      # `pnpm build`, `pnpm build:app` and `pnpm check:chunks` used to run here
      # and were deleted with the web client without this file being touched —
      # so CI failed on a missing script for three commits, and every check
      # after it stopped running. That includes the secret scan, which is the
      # one guard whose stakes went UP when the client became an APK.
      #
      # A Metro bundle is the honest "does it build" for this repo: it resolves
      # the monorepo under pnpm's isolated layout, which is the thing most
      # likely to break and the thing a typecheck cannot see.
      - name: Icon set matches its manifest
        run: pnpm check:icons

      # Warns while the launcher icon and splash are unconfigured — a known,
      # written-down gap — and fails the moment app.json names an image it
      # cannot find, is the wrong size, or would be clipped by an OEM mask.
      - name: Launcher icon and splash
        run: pnpm check:assets

      - name: Bundle the app (Metro)
        run: pnpm mobile:export

      # Scans the bundle built immediately above. Invariant 12: a secret in
      # here ships inside an APK and cannot be recalled from a device.
      - name: Secret hygiene
        run: pnpm check:secrets

  # ── What the server is allowed to run ───────────────────────────────────────
  #
  # `release` is a branch that only ever points at a commit this workflow went
  # green on. The farm server tracks it — never `main` — so a red build cannot
  # reach a farm even for the minutes it takes somebody to notice and revert.
  #
  # ## Why this pushes a ref instead of deploying
  #
  # The obvious shape is an SSH step: put a private key in GitHub Secrets, open
  # port 22 to GitHub's runner ranges, and have the runner drive the box. That
  # trades a real property for convenience — **GitHub would hold a credential
  # that opens a shell on the machine holding every farm's records**, and the
  # runner ranges it would have to be reachable from are large enough to be the
  # internet.
  #
  # Pulling inverts it. The box reaches out on a timer
  # (`scripts/deploy/steading-deploy.timer`), nothing inbound is opened, and
  # there is no key anywhere that a leaked GitHub token would hand over. The
  # cost is latency — up to five minutes — which for an app whose clients queue
  # offline by design is not a cost at all.
  release:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # The built-in GITHUB_TOKEN, scoped to this. No secret to create, none to
      # rotate, and it cannot reach anything outside this repository.
      contents: write
    steps:
      - uses: actions/checkout@v4

      # `--force` is deliberately absent. `release` must only ever move forward
      # along main's history — a fast-forward that fails means the two have
      # diverged, and the right answer to that is a person looking rather than
      # a server being handed whatever the last green run happened to be.
      - name: Move release to this commit
        run: git push origin HEAD:refs/heads/release
