name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      # A real mongod, so the isolation and idempotency suites actually run.
      # STEADING_REQUIRE_DB below turns "no database" into a failure rather
      # than a skip — the Phase 1 exit gate cannot be met by a suite that
      # quietly did not execute.
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGODB_TEST_URI: mongodb://localhost:27017
      STEADING_REQUIRE_DB: '1'
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DB: steading
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else

    steps:
      - uses: actions/checkout@v4

      # No version pin here on purpose — action-setup reads packageManager from
      # package.json, so CI and a developer machine cannot drift apart.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Blocking, per Phase 1 spec T5.
      - name: Lint
        run: pnpm lint

      - name: No inline disables of the db guard
        run: pnpm check:no-db-disables

      - name: Typecheck
        run: pnpm typecheck

      # Includes the isolation suite (the exit gate) and the idempotency suite.
      - name: Test
        run: pnpm test

      # The three scripts CI never invoked — which is exactly why two of them
      # were broken from the day they were written. Running them here means a
      # setup command cannot rot unnoticed again.
      - name: Apply indexes (pnpm db:indexes)
        run: pnpm db:indexes

      - name: Seed the first org and owner (pnpm db:seed)
        run: pnpm db:seed "CI Farm" ci-owner@example.test 'a properly long passphrase'

      - name: Verify the server data path (pnpm db:verify)
        run: pnpm db:verify

      - name: Build
        run: pnpm build

      # Both bundles, because the secret check scans both. The Vite output was
      # previously committed, so what got scanned was whatever had last been
      # built by hand — a stale bundle can pass while the current source leaks.
      - name: Build the Vite client
        run: pnpm build:app

      - name: Secret hygiene
        run: pnpm check:secrets

      # The native build reaches its database through a dynamic import, and a
      # dynamic import is the easiest thing in a bundle to lose silently.
      - name: Native chunks survived the bundler
        run: pnpm check:chunks

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The Phase 2 exit gate: airplane mode, 50 mutations, hard restart,
      # reconnect, zero loss, zero duplicates. Runs against the build above.
      - name: Exit gate (offline engine)
        run: pnpm e2e
        env:
          AUTH_SECRET: phase-2-exit-gate-secret-value

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
