name: CI

on:
  push:
    branches: [main]
  pull_request:

  # ── Shipping to the farm server is a decision, not a consequence ────────────
  #
  # Actions -> CI -> "Run workflow". That re-runs every check below against the
  # ref you pick and, only if they all pass, moves `release` — which is what the
  # box follows.
  #
  # **Deliberately not automatic on a green main.** Merging and shipping are
  # different acts, and in this repo the gap between them is where the real
  # defects live: the camera crash, the portrait lock, a VPN address compiled
  # into an APK, a systemd directive that let the port bind and then killed the
  # process. Every one of them passed CI. The server half is genuinely well
  # covered here — a real mongod, the isolation suite, `db:verify` — but "the
  # tests pass" and "I have tried it on the tablet" are different claims, and
  # the button is where the second one gets made.
  #
  # Not a permanent shape. While the only farms on the box are the author's and
  # a tester's, the cost of a bad deploy is an afternoon, and one click is
  # cheap enough either way. Deleting the `if:` on the release job below is all
  # it takes to go back to shipping every green main.
  #
  # It runs from the GitHub web UI or the phone app, so shipping does not need a
  # laptop or a checkout.
  #
  # **No `ref` input, on purpose.** The dispatch form already has a branch
  # selector, and `actions/checkout` defaults to it in every job — so `verify`
  # and `release` below provably act on the same commit. Adding an input would
  # have created a second source of truth, and the failure mode is the one that
  # matters: testing one commit and shipping another, with both steps green.
  workflow_dispatch:
    inputs:
      # Not a ref, so it does not reintroduce the hazard the note above refuses
      # — `verify` and `release` still act on the branch the form selected.
      # This only says how far the number moves once they have.
      bump:
        description: 'Version to move before shipping. "none" also skips the app build.'
        type: choice
        default: patch
        options: [patch, minor, major, none]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      # A real mongod, so the isolation and idempotency suites actually run.
      # HOMEFARM_REQUIRE_DB below turns "no database" into a failure rather
      # than a skip — the Phase 1 exit gate cannot be met by a suite that
      # quietly did not execute.
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGODB_TEST_URI: mongodb://localhost:27017
      HOMEFARM_REQUIRE_DB: '1'
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DB: homefarm
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else

    steps:
      - uses: actions/checkout@v4

      # No version pin here on purpose — action-setup reads packageManager from
      # package.json, so CI and a developer machine cannot drift apart.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Blocking, per Phase 1 spec T5.
      - name: Lint
        run: pnpm lint

      - name: No inline disables of the db guard
        run: pnpm check:no-db-disables

      - name: Typecheck
        run: pnpm typecheck

      # Includes the isolation suite (the exit gate) and the idempotency suite.
      - name: Test
        run: pnpm test

      # The three scripts CI never invoked — which is exactly why two of them
      # were broken from the day they were written. Running them here means a
      # setup command cannot rot unnoticed again.
      - name: Apply indexes (pnpm db:indexes)
        run: pnpm db:indexes

      - name: Seed the first org and owner (pnpm db:seed)
        run: pnpm db:seed "CI Farm" ci-owner@example.test 'a properly long passphrase'

      - name: Verify the server data path (pnpm db:verify)
        run: pnpm db:verify

      # ── The client, which is now the only one ────────────────────────────
      #
      # `pnpm build`, `pnpm build:app` and `pnpm check:chunks` used to run here
      # and were deleted with the web client without this file being touched —
      # so CI failed on a missing script for three commits, and every check
      # after it stopped running. That includes the secret scan, which is the
      # one guard whose stakes went UP when the client became an APK.
      #
      # A Metro bundle is the honest "does it build" for this repo: it resolves
      # the monorepo under pnpm's isolated layout, which is the thing most
      # likely to break and the thing a typecheck cannot see.
      - name: Icon set matches its manifest
        run: pnpm check:icons

      # Warns while the launcher icon and splash are unconfigured — a known,
      # written-down gap — and fails the moment app.json names an image it
      # cannot find, is the wrong size, or would be clipped by an OEM mask.
      - name: Launcher icon and splash
        run: pnpm check:assets

      - name: Bundle the app (Metro)
        run: pnpm mobile:export

      # Scans the bundle built immediately above. Invariant 12: a secret in
      # here ships inside an APK and cannot be recalled from a device.
      - name: Secret hygiene
        run: pnpm check:secrets

  # ── The image, which nothing exercised until Fly or the box booted it ───────
  #
  # **`.npmrc` sets `node-linker=hoisted`, and that is a deliberate trade with a
  # blind spot.** A flat tree means a package can `import` something it never
  # declared — the file says so itself — and it is the right trade, because
  # unwinding it re-breaks the Windows Android build over a CMake path-length
  # wall. But the Docker build and `deploy.sh` both run
  # `pnpm install --filter "@homefarm/api..."`, so an undeclared import resolves
  # everywhere a developer looks — local dev, `pnpm test`, the whole `verify`
  # job above — and is absent exactly where the service actually runs. There is
  # no compile step to catch it, so the failure is `MODULE_NOT_FOUND` at boot.
  #
  # The image narrows once more than the box does: `--prod` drops
  # devDependencies, which the box keeps. So this catches a second class the box
  # never would.
  #
  # Nothing violates it today — every non-relative import in `apps/api/src` is
  # declared in its manifest, checked. This is a gate against the next one, and
  # the reason it needs to exist is what happens without it: the timer runs
  # `deploy.sh` with no human present, the restart fails, and the script
  # deliberately refuses to roll back — so the API stays down until somebody
  # notices. A red check here costs a build; the alternative costs an outage.
  #
  # Its own job rather than a step in `verify`: it needs none of that job's
  # setup, it runs alongside rather than after, and "the image does not boot" is
  # a sentence worth reading on its own rather than at the bottom of a long log.
  container:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The build context is the repository root, because the Dockerfile copies
      # the lockfile, the workspace file and four manifests from it.
      - name: Build the API image
        env:
          DOCKER_BUILDKIT: '1'
        run: docker build -f apps/api/Dockerfile -t homefarm-api:ci .

      # ── Booting it is the half that matters ──────────────────────────────
      #
      # A build that succeeds proves the install resolved; only starting the
      # process proves every module it imports at boot is present, which is the
      # defect this job exists for.
      #
      # `/health` touches nothing — no database connection — which is exactly
      # what makes it the right probe here: this is asking whether the service
      # can start, not whether Mongo is reachable. The step after this one asks
      # `/ready`, which is the opposite question.
      #
      # AUTH_SECRET has a 32-character floor in `env.ts`, and MONGODB_URI only
      # has to be non-empty for a boot that never dials it.
      - name: Boot it and ask /health
        run: |
          set -euo pipefail

          docker run -d --name homefarm-api-ci -p 3001:3001 \
            -e AUTH_SECRET=ci-only-secret-not-used-anywhere-else \
            -e MONGODB_URI=mongodb://127.0.0.1:27017 \
            homefarm-api:ci

          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:3001/health >/dev/null 2>&1; then
              echo "answering on :3001 after ${attempt}s"
              exit 0
            fi

            # A container that has already exited will never answer, so say so
            # now rather than after thirty seconds of silence.
            if [ "$(docker inspect -f '{{.State.Running}}' homefarm-api-ci)" != "true" ]; then
              echo "::error::The API image built but the process did not stay up."
              docker logs homefarm-api-ci
              exit 1
            fi

            sleep 1
          done

          echo "::error::The API image booted but never answered /health."
          docker logs homefarm-api-ci
          exit 1

      # ── The other half of the split (P2-4) ───────────────────────────────
      #
      # This container is given a MONGODB_URI with nothing listening behind it,
      # which is precisely the shape of a deployment with a wrong one: the
      # process is up, `/health` is green, and every route that touches a
      # record fails. `deploy.sh` polls `/ready` so that a deploy fails there
      # rather than at the first farm to log an egg — and this asserts the two
      # endpoints really do disagree in the built image. A `/ready` that
      # quietly stopped dialling Mongo would look perfectly healthy here and
      # wave through exactly the deploy it exists to stop.
      - name: Ask /ready, which must refuse
        run: |
          set -euo pipefail

          # Ten seconds, not three. The driver waits five to select a server
          # before giving up, so a shorter deadline times the request out
          # instead of reading the answer it was about to give.
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
            http://127.0.0.1:3001/ready || true)"

          if [ "$code" != "503" ]; then
            echo "::error::/ready answered '${code}' with no database behind it. It must refuse."
            docker logs homefarm-api-ci
            exit 1
          fi

          echo "/ready refused, as it must"

      - name: What it said
        if: always()
        run: docker logs homefarm-api-ci 2>&1 | tail -40 || true

  # ── What the server is allowed to run ───────────────────────────────────────
  #
  # `release` is a branch that only ever points at a commit this workflow went
  # green on. The farm server tracks it — never `main` — so a red build cannot
  # reach a farm even for the minutes it takes somebody to notice and revert.
  #
  # ## Why this pushes a ref instead of deploying
  #
  # The obvious shape is an SSH step: put a private key in GitHub Secrets, open
  # port 22 to GitHub's runner ranges, and have the runner drive the box. That
  # trades a real property for convenience — **GitHub would hold a credential
  # that opens a shell on the machine holding every farm's records**, and the
  # runner ranges it would have to be reachable from are large enough to be the
  # internet.
  #
  # Pulling inverts it. The box reaches out on a timer
  # (`scripts/deploy/homefarm-deploy.timer`), nothing inbound is opened, and
  # there is no key anywhere that a leaked GitHub token would hand over. The
  # cost is latency — up to five minutes — which for an app whose clients queue
  # offline by design is not a cost at all.
  release:
    # Only from the button. A push to main runs the checks and stops there.
    #
    # Both gates, not just `verify`. A promotion that skipped `container` would
    # move `release` to a commit whose image cannot start, and the box would
    # find that out on a five-minute timer with nobody watching.
    needs: [verify, container]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      # The built-in GITHUB_TOKEN, scoped to this. No secret to create, none to
      # rotate, and it cannot reach anything outside this repository.
      contents: write
    outputs:
      # The commit that was actually promoted, which is the version-bump commit
      # rather than the one this run started on. The app job below builds at it
      # so the release tag lands where the box will look.
      sha: ${{ steps.promoted.outputs.sha }}
    steps:
      # Same default ref as `verify` — the branch chosen in the dispatch form —
      # so what was tested and what ships cannot come apart.
      - uses: actions/checkout@v4
        with:
          # **The whole history, and the first promote failed without it.**
          #
          # `actions/checkout` clones one commit by default. Pushing to another
          # branch then asks git to prove the move is a fast-forward using
          # objects it does not have, and it refuses:
          #
          #   ! [rejected]  HEAD -> release (fetch first)
          #   hint: Updates were rejected because the remote contains work that
          #   hint: you do not have locally.
          #
          # Which reads as `release` having diverged, and it had not — it was
          # four commits behind main and a perfectly ordinary fast-forward. The
          # hint sends you looking for a divergence that does not exist.
          #
          # Reproduced with a `file://` remote, which honours --depth where a
          # plain local clone silently ignores it: shallow rejects with that
          # exact text, full succeeds.
          #
          # Only this job needs it. `verify` stays shallow, because a full
          # clone on every pull request is a cost for no benefit.
          fetch-depth: 0

      # ── The version, moved by the act of shipping ────────────────────────
      #
      # `expo.version` sat at 0.1.0 through every build this project has made,
      # so every report from a handset has been about "0.1.0" — a number that
      # identifies nothing. The support bundle carries it, the install page
      # shows it, and neither was worth reading.
      #
      # **Here rather than in a person's hands**, for the reason
      # `scripts/lib/version-bump.mjs` gives about `versionCode`: a rule that
      # depends on remembering an edit is a rule that holds until the first
      # time it matters. Shipping is already deliberate and already has a
      # button, so the button is where the number moves.
      #
      # **Committed BEFORE `release` is moved, and that ordering is the whole
      # point.** Bumping after the promote would ship a build stamped with the
      # version before it — every artefact permanently off by one, which is
      # worse than not bumping at all because it looks correct.
      #
      # The push to the release branch below is what actually ships, so if this
      # push fails — a protected branch, or main moved under us — the job stops
      # here and nothing has been released. Loud, and nothing half-done.
      - name: Move the version on
        if: inputs.bump != 'none'
        run: |
          set -euo pipefail
          MOVED="$(node scripts/release-version.mjs '${{ inputs.bump }}')"
          echo "VERSION_MOVED=$MOVED" >> "$GITHUB_ENV"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/app.json
          # `[skip ci]` because this commit changes one string in app.json and
          # its parent has just gone green on the full suite. Re-running verify
          # over a version number is a quarter of an hour for no information.
          git commit -m "Version ${MOVED} [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"

      # `--force` is deliberately absent, and it is the guard rather than a
      # tidiness preference: `release` may only move FORWARD. A promote that
      # would rewind the server — shipping an older commit over a newer one —
      # fails here instead of quietly handing a farm yesterday's code.
      #
      # With the full history above, that check now happens for the right
      # reason: git can see the ancestry and refuses a real rewind, rather than
      # refusing everything because it cannot see anything.
      #
      # To go back on purpose, that is a revert commit through the normal route,
      # so what the server runs stays a thing that exists in main's history.
      - name: Move release to this commit
        id: promoted
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/release
          # Recorded only after the push, so the app job cannot build for a
          # promote that did not happen.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Say what shipped
        run: |
          echo "### Shipped \`$(git rev-parse --short HEAD)\` — v$(node scripts/release-version.mjs show)" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          # Only when it actually moved. "none" is a legitimate promote — a
          # re-ship of a version already cut — and claiming a bump that did not
          # happen is the same lie this whole step exists to stop telling.
          if [ -n "${VERSION_MOVED:-}" ]; then
            echo "Version ${VERSION_MOVED}" >> "$GITHUB_STEP_SUMMARY"
          else
            # Said, so a server-only release does not read as a build that
            # failed to start. Not building is the point of choosing `none`.
            echo "Server only — no version change and no app build." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          git log -1 --format='%s%n%n%an, %ar' >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The server picks this up within five minutes." >> "$GITHUB_STEP_SUMMARY"

  # ── The app, because promoting the server never rebuilt it ──────────────────
  #
  # **The gap that kept costing us a round trip.** `release` moving updates the
  # API and the Caddyfile; the phone runs an APK. So a fix to a screen could be
  # merged, promoted and deployed with the handset still showing the old one —
  # reported more than once as "none of the changes landed", and correct every
  # time.
  #
  # ## Why this is `apk.yml` and no longer `eas build`
  #
  # This step used to start an EAS build and not wait for it. #153 is what that
  # cost: a promote hit the free tier's monthly Android cap, the build was
  # refused, and the step that would have said so is the one that skips on
  # failure — a half-done release with a blank summary. `apk.yml` builds on a
  # runner with our own keystore and no Expo account in the path, so no quota
  # can refuse it, and a failure here is a red job rather than a silence.
  #
  # ## The commit, which is the whole reason this is a separate job
  #
  # `release` above makes the version-bump commit and promotes THAT, so the
  # commit being shipped does not exist when this workflow starts. The APK has
  # to be built at it and tagged against it, because `deploy.sh` finds the app
  # for a box by resolving the commit the box is serving to a release tag. So
  # the promoted sha is handed over as an output; see `apk.yml`'s `ref` input.
  #
  # ## What it costs, and what it deliberately does not
  #
  # The promote is already finished when this starts — `release` has been pushed
  # and the box will deploy the server on its next tick regardless. So a Gradle
  # build does not stand between a server fix and a farm; it only keeps the run
  # marked in-progress for another quarter of an hour.
  #
  # `none` still means no app, exactly as before: a server-only change has no
  # new app in it, and building one anyway mints a version differing from the
  # last only in its build number. Tied to `bump` rather than given a dropdown
  # of its own, because the two questions are one question — "am I shipping a
  # new app?" — and a second control that could disagree with the first is a
  # second thing to get wrong.
  #
  # `secrets: inherit` is required: the five signing secrets are the reason the
  # job can produce an APK a farm's tablet will accept as an update rather than
  # as a different app.
  #
  # ## `permissions` here is not optional, and leaving it off is a hard failure
  #
  # **A called workflow's ceiling is the calling job's own permissions, not the
  # repository maximum.** That is the difference between this job and `release`
  # above: `release` asks for `contents: write` and gets it, because a job may
  # request up to what the repository allows. This job asked for nothing, so it
  # inherited the workflow-level default — `contents: read` — and that became
  # the ceiling for everything inside `apk.yml`.
  #
  # The result is not a permission error at the moment of publishing. It is
  #
  #   The nested job 'publish' is requesting 'contents: write',
  #   but is only allowed 'contents: read'.
  #
  # refusing the **whole file** before any job starts, on every event — so a
  # push and a pull request that would never have reached this job failed too,
  # and CI on main went red until it was put back. Checked statically, which is
  # the one good thing about it: it cannot reach a farm.
  #
  # Least privilege survives it. This raises the ceiling; `apk.yml`'s own
  # `permissions: contents: read` still holds the Gradle and npm job down to
  # read, and only its `publish` job — which runs no third-party build code —
  # takes the write.
  app:
    needs: release
    if: inputs.bump != 'none'
    uses: ./.github/workflows/apk.yml
    with:
      ref: ${{ needs.release.outputs.sha }}
    permissions:
      contents: write
    secrets: inherit
