name: APK

# ── Building the app ourselves, instead of on EAS ───────────────────────────
#
# The free tier caps Android builds per month. Issue #153 is what hitting that
# cap looked like: `release` promoted the server, the app build was refused,
# and the step that would have said so is the one that skips on failure.
#
# ## Why a runner and not the box
#
# `docs/TESTING-BUILD.md` §7 already asked and the answer holds. The keystore
# is the one piece of state in this project that cannot be regenerated from
# anything (§8), and building on the box means it lives on an internet-facing
# machine beside a public web server; the JDK and SDK are also ten gigabytes on
# a free-tier instance the repo has a disk-resize section for. And a third
# reason those sections predate: the box is aarch64 and Google ships the
# Android build-tools as x86_64 binaries only, so `aapt2` and `zipalign` there
# come from emulation or a community rebuild — fine for a hobby machine, not
# for a signed artefact.
#
# A runner is x86_64 with the SDK on it, and a repository secret is
# materialised for one job rather than held all the time. No Expo account is in
# the path: `expo prebuild` is local, so the queue and the quota are not
# involved at all.
#
# ## Where the judgement lives, and why it is not here
#
# **A workflow file cannot be run locally, cannot be unit tested, and is
# exercised for the first time on the run that matters.** Every non-obvious
# rule below is therefore in `scripts/lib/apk.mjs`, held by
# `tests/unit/apk.test.ts`, and this file orders steps. The first draft of it
# had the version arithmetic inline and a free-text `versionCode` input with
# the right answer written in the description — which is not a guard, it is a
# hope, and a typo there produces an APK no device will accept.
#
# ## What it deliberately does not do
#
# It does not put the APK on the box. §7 is explicit that there is no upload
# route — *"a download endpoint is a static file and an upload endpoint is a
# way to put a file on a server, and those are not the same risk at all"* — so
# nothing here opens one. The artefact goes to a Release, which the same
# section calls the right place for the archive, and reaching the shelf stays
# `publish-apk.sh <path>`.

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: 'Leave blank. Only set to force a code ABOVE everything released.'
        type: string
        required: false
      release:
        description: 'Attach the APK to a GitHub Release.'
        type: boolean
        default: true
  # So the release job can call this instead of EAS, without a second copy of
  # it existing to drift. Callers must pass `secrets: inherit`.
  workflow_call:
    inputs:
      versionCode:
        type: string
        required: false
      release:
        type: boolean
        default: true

# Least privilege by default; the publish job raises its own.
permissions:
  contents: read

# One at a time. Two runs would derive the same versionCode from the same tag
# list and then race to create the same release.
concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung Gradle would otherwise sit on a runner for six hours.
    timeout-minutes: 45
    outputs:
      apk: ${{ steps.plan.outputs.apk }}
      tag: ${{ steps.plan.outputs.tag }}
      code: ${{ steps.plan.outputs.code }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      # ── Refuse before doing any work ─────────────────────────────────────
      #
      # `expo prebuild` points the release build type at the **debug**
      # signingConfig. So the natural failure of a missing secret is not a
      # broken build — it is a completely ordinary APK signed with the wrong
      # key, which Android treats as a different app: installing it means
      # uninstalling first, and an uninstall takes the farm's records with it
      # (`TESTING-BUILD.md` §3, last row). There is no fallback here on
      # purpose.
      - name: The signing key has to be here
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${KEYSTORE:-}" ]          || missing+=(ANDROID_KEYSTORE_BASE64)
          [ -n "${KEYSTORE_PASSWORD:-}" ] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [ -n "${KEY_ALIAS:-}" ]         || missing+=(ANDROID_KEY_ALIAS)
          [ -n "${KEY_PASSWORD:-}" ]      || missing+=(ANDROID_KEY_PASSWORD)
          [ -n "${CERT_SHA256:-}" ]       || missing+=(ANDROID_CERT_SHA256)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Signing secrets are not set: ${missing[*]}"
            {
              echo "### No signing key, so no APK"
              echo ""
              echo "This job will not fall back to a debug key. An APK signed with a"
              echo "different key installs as a *different app* — every copy on a farm"
              echo "has to be uninstalled first, and an uninstall takes the records."
              echo ""
              echo "\`docs/TESTING-BUILD.md\` §8 has the export; the table below it has"
              echo "the five secrets."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # The versionCode is derived from the tags of everything already
          # released, so they have to be here. See `scripts/lib/apk.mjs`.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Same as `verify` in ci.yml. Two node versions across one repo's
          # workflows is a difference nobody notices until it matters.
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches the Gradle home and the configuration cache across runs. Without
      # it every build re-downloads AGP and the whole dependency graph, which is
      # most of the wall clock.
      - uses: gradle/actions/setup-gradle@v4

      - run: pnpm install --frozen-lockfile

      # ── What this APK is, decided once ───────────────────────────────────
      #
      # Derives the versionCode from the releases that already exist, stamps it
      # into `app.json` for `expo prebuild` to read, and names the artefact the
      # way `publish-apk.sh` names things so the archive and the shelf agree.
      # All of it is tested in `tests/unit/apk.test.ts`.
      - name: Plan the build
        id: plan
        env:
          # Through the environment rather than interpolated into the command:
          # `${{ }}` in a `run:` is textual substitution, and this one comes
          # from a form. Blank means "derive it", which is the normal case.
          APK_VERSION_CODE: ${{ inputs.versionCode }}
        run: git tag --list 'v*' | node scripts/apk-plan.mjs

      # `--clean` for the reason CLAUDE.md gives: `android/` is generated and
      # gitignored, so there is nothing to preserve and stale resources are the
      # whole failure mode. It is also what picks up every icon, splash,
      # permission and plugin change in app.json.
      # ── The two things the EAS profile used to supply ────────────────────
      #
      # A runner build reads no `eas.json` profile, so both of the build-time
      # values `preview-farm` carried have to be put back by hand:
      #
      #   `EXPO_PUBLIC_BUILD`   — `pnpm stamp` writes it to `apps/mobile/.env.local`,
      #                           which is what `eas-build-post-install` did on
      #                           the EAS side. Without it the support bundle
      #                           cannot say which build a report came from.
      #
      #   `EXPO_PUBLIC_API_URL` — the farm server's address, inlined into the
      #                           bundle by Metro. Without it the app boots and
      #                           says it has no farm server. It comes from
      #                           `farmOrigin`, which reads the same profile the
      #                           EAS build would have, so the address is not
      #                           written down twice.
      - name: Stamp the build
        run: pnpm stamp

      - name: Prebuild the native project
        run: pnpm mobile:prebuild

      - name: Build it
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_API_URL: ${{ steps.plan.outputs.api }}
        run: ./gradlew assembleRelease --no-daemon

      # ── Sign it ──────────────────────────────────────────────────────────
      #
      # Gradle has just produced a release build carrying a *debug* signature,
      # because that is what prebuild wires up. The signature is replaced here
      # rather than by patching the generated Gradle, which regenerates on
      # every run and would be a string edit against a moving file.
      #
      # `zipalign` first: apksigner will not align what it signs, and an
      # unaligned APK is refused at install.
      - name: Sign it
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APK: ${{ steps.plan.outputs.apk }}
        run: |
          set -euo pipefail

          TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)"
          [ -n "$TOOLS" ] || { echo "::error::No Android build-tools under $ANDROID_HOME"; exit 1; }
          echo "build-tools: $TOOLS"

          IN=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          [ -f "$IN" ] || { echo "::error::Gradle produced no APK at $IN"; exit 1; }

          # Outside the workspace so no later step can archive it, and shredded
          # however this step exits — including the failure paths above.
          KEYSTORE="$RUNNER_TEMP/signing.jks"
          trap 'shred -u "$KEYSTORE" 2>/dev/null || rm -f "$KEYSTORE"' EXIT

          # `-d -i` tolerates the line breaks a pasted secret picks up.
          printf '%s' "$KEYSTORE_B64" | base64 -d -i > "$KEYSTORE"

          "$TOOLS/zipalign" -p -f 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/$APK" \
            "$RUNNER_TEMP/aligned.apk"

          "$TOOLS/aapt2" dump badging "$RUNNER_TEMP/$APK" > "$RUNNER_TEMP/badging.txt"
          "$TOOLS/apksigner" verify --print-certs "$RUNNER_TEMP/$APK" > "$RUNNER_TEMP/certs.txt"

      # ── The gate between this and anybody's tablet ───────────────────────
      #
      # Every check in `apk-check.mjs` exists because the thing it catches
      # succeeds silently: a build that read a stale app.json, a keystore from
      # the wrong Expo account, the wrong alias inside the right keystore, a
      # secret pasted with a line break. None look like errors, all produce an
      # ordinary APK, and the first place the difference shows is a device.
      - name: Confirm it is what it says, signed by the key the farm has
        env:
          FINGERPRINT: ${{ secrets.ANDROID_CERT_SHA256 }}
          VERSION: ${{ steps.plan.outputs.version }}
          CODE: ${{ steps.plan.outputs.code }}
        run: |
          node scripts/apk-check.mjs \
            --badging "$RUNNER_TEMP/badging.txt" \
            --certs "$RUNNER_TEMP/certs.txt" \
            --package com.steading.app \
            --version "$VERSION" \
            --code "$CODE" \
            --fingerprint "$FINGERPRINT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.plan.outputs.apk }}
          path: ${{ runner.temp }}/${{ steps.plan.outputs.apk }}
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: build
    if: inputs.release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job can write, and it runs no third-party build code — the
    # Gradle and npm graph above never holds a token that can push.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.apk }}
          path: dist

      # A Release is the archive, per §7: it answers "the build that was on her
      # tablet in August" after the box has been rebuilt or the file pruned. It
      # is a poor *channel* and is not used as one — the box still serves the
      # install page.
      - name: Attach it to a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          APK: ${{ needs.build.outputs.apk }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Cannot happen from a normal run — the code is derived to be one
            # past every existing tag — so it means a tag was made by hand or a
            # release was deleted and the counter walked back onto it. Refusing
            # is the point: overwriting would make two different APKs share a
            # name, and `publish-apk.sh` refuses that for the same reason.
            echo "::error::Release $TAG already exists. Nothing was overwritten."
            exit 1
          fi
          gh release create "$TAG" "dist/$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Built on a GitHub runner. Package, version and signing certificate verified before publishing — see \`scripts/apk-check.mjs\`."

      - name: Say what was built
        env:
          TAG: ${{ needs.build.outputs.tag }}
          APK: ${{ needs.build.outputs.apk }}
          CODE: ${{ needs.build.outputs.code }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            echo "### \`$APK\`"
            echo ""
            echo "- versionCode \`$CODE\`, version \`$VERSION\`"
            echo "- signature verified against \`ANDROID_CERT_SHA256\`"
            echo "- release [\`$TAG\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG})"
            echo ""
            echo "**Not on the box.** Download it and run"
            echo "\`scripts/deploy/publish-apk.sh <path>\` to put it on the shelf."
          } >> "$GITHUB_STEP_SUMMARY"
